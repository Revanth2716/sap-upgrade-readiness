server:
  port: 8086
  servlet:
    session:
      timeout: 30m
    cookie:
      http-only: true
      same-site: lax

spring:
  application:
    name: "SAP Upgrade & Support Package Readiness"

  datasource:
    url: jdbc:h2:file:./data/upgradedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  thymeleaf:
    cache: true
    encoding: UTF-8

  mail:
    host: localhost
    port: 1025

logging:
  level:
    root: INFO
    com.revzz.sap.upgrade: INFO

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
upgrade:
  application-name: "SAP Upgrade & Support Package Readiness"
  sap-system: "SPAM"
  # local  - read the patch data from the local database (the default)
  # jco    - read it from a live SAP system over RFC (needs the with-jco profile)
  gateway: "local"
  seed-demo-users: true
  seed-demo-data: true
  demo-password: "demo1234"

  seed:
    random-seed: 20261112

  policy:
    # A system that has not been patched for this many days is a risk: the
    # component list moves on whether you patch or not.
    stale-patch-window-days: 90
    # How many patch levels a component may sit behind the landscape before
    # it is called out.
    component-drift-levels: 1
    # A system may not sit this many patch levels behind the landscape.
    max-system-drift-levels: 2

  mail:
    enabled: false
    from: "upgrade-readiness@example.com"
    to: "basis-team@example.com"
    subject-prefix: "[SAP Upgrade]"
