<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · ' + ${appName}">SAP Upgrade &amp; Support Package Readiness</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="nav(active)" class="topbar">
  <div class="brand">
    <span th:text="${appName}">SAP Upgrade &amp; Support Package Readiness</span>
    <span class="tag" th:text="${sapSystem}">SPAM</span>
  </div>

  <div class="navlinks">
    <a th:href="@{/}" th:classappend="${active == 'overview'} ? 'active'">Readiness</a>
    <a th:href="@{/changelog}" th:classappend="${active == 'changelog'} ? 'active'"
       th:if="${currentRole == 'UPGRADE_ADMIN' or currentRole == 'ANALYST'}">Changelog</a>
    <a th:href="@{/report}" th:classappend="${active == 'report'} ? 'active'"
       th:if="${currentRole == 'UPGRADE_ADMIN' or currentRole == 'ANALYST'}">Report</a>
  </div>

  <div class="userbox">
    <span th:text="${displayName}">User</span>
    <span class="role" th:text="${currentRole}">ROLE</span>
    <form th:action="@{/logout}" method="post" style="margin:0">
      <button class="secondary small" type="submit">Sign out</button>
    </form>
  </div>
</nav>

</body>
</html>
